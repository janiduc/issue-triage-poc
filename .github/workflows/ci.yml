# Continuous integration: run the test suite on every push and pull request.
# The AI model, GitHub and Jira are mocked in the tests, so no secrets are needed here.
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flask requests scikit-learn numpy
      - run: python -m unittest -v
        env:
          USE_EMBEDDINGS: "false"
